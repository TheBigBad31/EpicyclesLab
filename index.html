<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>EpicyclesLab — Atelier Épicycles & Séries de Fourier</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <!-- Zone Graphique Principale Canvas -->
      <main class="canvas-viewport">
        <canvas id="epicycle-canvas"></canvas>
        <div id="transport-bar-slot"></div>
      </main>

      <!-- Panneau Latéral (Atelier & Dessin Inverse) -->
      <aside class="sidebar" id="sidebar-container">
        <!-- Onglets de bascule de Mode -->
        <nav class="mode-tabs">
          <button id="tab-workshop" class="tab-btn" data-target="workshop-container">
            🌀 Mode Atelier
          </button>
          <button id="tab-inverse" class="tab-btn active" data-target="inverse-container">
            ✏️ Dessin Inverse (DFT/FFT)
          </button>
        </nav>

        <div id="workshop-container" class="tab-pane" style="display: none;"></div>
        <div id="inverse-container" class="tab-pane"></div>
      </aside>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
